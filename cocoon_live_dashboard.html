<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocoon Suites — Revenue Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c8a96e;--gold-light:#d4ba82;--dark:#0f1117;--dark-2:#161920;--dark-3:#1a1f2b;--border:#262b36;--text-1:#e8e4dc;--text-2:#a0a8b8;--text-3:#5a6070;--green:#70b090;--red:#e07070;--blue:#7098d8;--sidebar:220px}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text-1);min-height:100vh}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{width:360px;background:var(--dark-2);border:1px solid var(--border);border-radius:16px;padding:40px}
.login-logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text-1);margin-bottom:4px}
.login-sub{font-size:11px;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:36px}
.login-label{display:block;font-size:11px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.login-input{width:100%;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text-1);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;margin-bottom:18px}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s;margin-top:4px}
.login-btn:hover{background:var(--gold-light)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:rgba(224,112,112,.1);border:1px solid rgba(224,112,112,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}

/* APP */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--dark-2);border-right:1px solid var(--border);padding:28px 0;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:0 20px 28px;border-bottom:1px solid var(--border)}
.logo-name{font-family:'DM Serif Display',serif;font-size:15px;color:var(--text-1)}
.logo-sub{font-size:10px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.nav{padding:16px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:var(--text-3);cursor:pointer;border-left:2px solid transparent;transition:all .15s;user-select:none}
.nav-item:hover{color:var(--text-2);background:var(--dark-3)}
.nav-item.active{color:var(--gold);border-left-color:var(--gold);background:var(--dark-3)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
.logout-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-3);padding:6px 12px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:all .15s;width:100%}
.logout-btn:hover{border-color:var(--text-3);color:var(--text-2)}
.main{flex:1;margin-left:var(--sidebar);padding:36px 48px 80px}
.section{display:none}
.section.active{display:block}

/* ELEMENTS */
.page-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--text-1);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text-3);margin-bottom:32px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.briefing{background:linear-gradient(135deg,var(--dark-3),var(--dark-2));border:1px solid rgba(200,169,110,.25);border-radius:12px;padding:22px 26px;margin-bottom:28px}
.briefing-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.briefing-items{display:flex;flex-direction:column;gap:10px}
.briefing-item{display:flex;align-items:flex-start;gap:12px;font-size:13px;color:var(--text-2);line-height:1.6}
.briefing-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.dot-alert{background:var(--red)}.dot-good{background:var(--green)}.dot-neutral{background:var(--gold)}
.briefing-item strong{color:var(--text-1)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.kpi-card{background:var(--dark-2);border:1px solid var(--border);border-radius:10px;padding:20px}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
.kpi-current{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text-1);line-height:1;margin-bottom:8px}
.kpi-ly{font-size:12px;color:var(--text-3);margin-bottom:6px}
.kpi-delta{font-size:13px;font-weight:600}
.kpi-delta.up{color:var(--green)}.kpi-delta.down{color:var(--red)}.kpi-delta.neutral{color:var(--gold)}
.table-card{background:var(--dark-2);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:24px;overflow-x:auto}
.card-title{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.card-sub{font-size:11px;color:var(--text-3);margin-bottom:18px;font-style:italic}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 10px;font-size:13px;border-bottom:1px solid #1a1f2b;color:var(--text-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
td:first-child{color:var(--text-1);font-weight:500}
tr.row-alert td{background:rgba(224,112,112,.04)}
tr.row-alert td:first-child{border-left:2px solid rgba(224,112,112,.3);padding-left:8px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.up{background:rgba(112,176,144,.12);color:var(--green)}.pill.down{background:rgba(224,112,112,.12);color:var(--red)}.pill.neutral{background:rgba(200,169,110,.12);color:var(--gold)}.pill.warn{background:rgba(224,112,112,.18);color:var(--red);border:1px solid rgba(224,112,112,.3)}
.season-badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.badge-peak{background:rgba(220,60,60,.12);color:#e07070;border:1px solid rgba(220,60,60,.2)}.badge-high{background:rgba(200,130,50,.12);color:#d4905a;border:1px solid rgba(200,130,50,.2)}.badge-shoulder{background:rgba(200,169,110,.12);color:var(--gold);border:1px solid rgba(200,169,110,.2)}.badge-low{background:rgba(80,160,120,.12);color:var(--green);border:1px solid rgba(80,160,120,.2)}
.action-tag{display:inline-flex;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600}
.action-hold{background:rgba(112,176,144,.1);color:var(--green);border:1px solid rgba(112,176,144,.2)}.action-watch{background:rgba(200,169,110,.1);color:var(--gold);border:1px solid rgba(200,169,110,.2)}.action-promo{background:rgba(224,112,112,.1);color:var(--red);border:1px solid rgba(224,112,112,.2)}.action-closed{background:rgba(60,65,80,.4);color:var(--text-3);border:1px solid var(--border)}
.pace-bars{display:flex;flex-direction:column;gap:4px;min-width:100px}
.pace-row{display:flex;align-items:center;gap:6px}
.pace-year{font-size:9px;color:var(--text-3);width:28px;flex-shrink:0}
.pace-track{flex:1;height:5px;background:var(--border);border-radius:3px}
.pace-fill{height:5px;border-radius:3px}
.fill-now{background:var(--gold)}.fill-ly{background:#3a4a5a}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.card{background:var(--dark-2);border:1px solid var(--border);border-radius:10px;padding:24px}
.ch-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1f2b}
.ch-item:last-child{border-bottom:none}
.ch-name{font-size:13px;color:var(--text-1);min-width:100px}
.ch-bar-wrap{display:flex;align-items:center;gap:8px;flex:1;margin:0 10px}
.ch-track{flex:1;height:4px;background:var(--border);border-radius:2px}
.ch-fill{height:4px;border-radius:2px}
.ch-pct{font-size:12px;font-weight:600;min-width:42px;text-align:right}
.ch-rev{font-size:11px;color:var(--text-3);min-width:65px;text-align:right}
.adr-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a1f2b}
.adr-item:last-child{border-bottom:none}
.adr-month{font-size:13px;color:var(--text-1);font-weight:500}
.adr-val{font-size:17px;font-family:'DM Serif Display',serif;color:var(--gold)}
.adr-vs{font-size:11px;color:var(--text-3);margin-top:1px}
.divider{display:flex;align-items:center;gap:14px;margin:32px 0 20px}
.divider span{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.divider-line{flex:1;height:1px;background:var(--border)}
.note{font-size:11px;color:var(--text-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--border);line-height:1.6}
.loading{display:flex;align-items:center;gap:12px;padding:60px;color:var(--text-3);font-size:14px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(224,112,112,.08);border:1px solid rgba(224,112,112,.2);border-radius:8px;padding:16px 20px;color:var(--red);font-size:13px}
.placeholder-msg{text-align:center;padding:60px;color:var(--text-3);font-size:14px;line-height:1.7}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Cocoon Suites</div>
    <div class="login-sub">Revenue Intelligence</div>
    <div class="login-error" id="login-error"></div>
    <label class="login-label">Email</label>
    <input type="email" id="login-email" class="login-input" placeholder="your@email.com" autocomplete="email">
    <label class="login-label">Password</label>
    <input type="password" id="login-password" class="login-input" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="login-btn" onclick="signIn()">Sign in</button>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="logo">
        <div class="logo-name">Cocoon Suites</div>
        <div class="logo-sub">Revenue Intelligence</div>
      </div>
      <nav class="nav">
        <div class="nav-item active" onclick="goto('dashboard',this)"><span class="nav-dot"></span> Dashboard</div>
        <div class="nav-item" onclick="goto('pricing',this)"><span class="nav-dot"></span> Pricing Engine</div>
        <div class="nav-item" onclick="goto('config',this)"><span class="nav-dot"></span> Configuration</div>
      </nav>
      <div class="sidebar-footer">
        <div id="user-email" style="font-size:11px;color:var(--text-3);margin-bottom:6px;word-break:break-all"></div>
        <button class="logout-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>
    <div class="main">
      <div class="section active" id="section-dashboard">
        <div style="margin-bottom:28px">
          <div class="page-title" id="greeting">Good morning, Theodore.</div>
          <div class="page-sub" id="snapshot-info">Loading...</div>
        </div>
        <div id="dashboard-content"><div class="loading"><div class="spinner"></div> Reading your database...</div></div>
      </div>
      <div class="section" id="section-pricing">
        <div class="page-title">Pricing Engine</div>
        <div class="page-sub">AI-powered rate suggestions</div>
        <div class="card"><div class="placeholder-msg">Coming soon.</div></div>
      </div>
      <div class="section" id="section-config">
        <div class="page-title">Configuration</div>
        <div class="page-sub">Hotel settings and rules</div>
        <div class="card"><div class="placeholder-msg">Coming soon.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://xxhvriahvdlvxcuawvpw.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aHZyaWFodmRsdnhjdWF3dnB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjIzMzQsImV4cCI6MjA5NzU5ODMzNH0.P4HQ_SL-gJkbHRWug-9tLbUZ5XzY6YqHS5Grd3Rq1-Q';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MONTHS=['April','May','June','July','August','September','October','November'];
const SEASON=['low','shoulder','high','peak','peak','high','shoulder','low'];
const SL={peak:'🔴 Peak',high:'🟠 High',shoulder:'🟡 Shoulder',low:'🟢 Low'};
const SB={peak:'badge-peak',high:'badge-high',shoulder:'badge-shoulder',low:'badge-low'};

async function signIn(){
  const email=document.getElementById('login-email').value.trim();
  const pwd=document.getElementById('login-password').value;
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-error');
  err.style.display='none';btn.disabled=true;btn.textContent='Signing in...';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pwd});
  if(error){err.textContent='Incorrect email or password.';err.style.display='block';btn.disabled=false;btn.textContent='Sign in';return;}
  showApp(data.user);
}

async function signOut(){
  await sb.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-password').value='';
}

function showApp(user){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-email').textContent=user.email;
  const h=new Date().getHours();
  document.getElementById('greeting').textContent=`${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}, Theodore.`;
  loadDashboard();
}

sb.auth.getSession().then(({data:{session}})=>{if(session)showApp(session.user);});
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});

function goto(page,el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('section-'+page).classList.add('active');
}

function fmt(n,type='pct'){
  if(n==null)return'—';
  if(type==='pct')return n.toFixed(2)+'%';
  if(type==='eur')return'€'+Math.round(n).toLocaleString();
  return n;
}

function pill(a,b,type='pct'){
  if(a==null||b==null)return'<span class="pill neutral">—</span>';
  const diff=a-b;
  const cls=Math.abs(diff)<(type==='pct'?1:5)?'neutral':diff>0?'up':'down';
  const sign=diff>0?'+':'';
  if(type==='pct')return`<span class="pill ${cls}">${sign}${diff.toFixed(1)} pts</span>`;
  const pct=((a-b)/b*100);
  return`<span class="pill ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function warnPill(a,b){
  if(a==null||b==null)return'<span class="pill neutral">Early</span>';
  const diff=a-b;
  const cls=diff<-5?'warn':diff>2?'up':'neutral';
  return`<span class="pill ${cls}">${diff>0?'+':''}${diff.toFixed(1)} pts</span>`;
}

function actionTag(c,l){
  if(c==null)return'<span class="action-tag action-closed">Closed</span>';
  if(l==null)return'<span class="action-tag action-watch">Watch</span>';
  const d=c-l;
  if(d<-10)return'<span class="action-tag action-promo">Consider promo</span>';
  if(d<-3)return'<span class="action-tag action-watch">Watch closely</span>';
  return'<span class="action-tag action-hold">On track</span>';
}

function findClosest(snaps,year,targetDate){
  const ys=snaps.filter(s=>s.year===year);
  if(!ys.length)return null;
  const t=new Date(targetDate).getTime();
  return ys.reduce((b,s)=>Math.abs(new Date(s.snapshot_date).getTime()-t)<Math.abs(new Date(b.snapshot_date).getTime()-t)?s:b);
}

async function loadDashboard(){
  try{
    const{data:snaps,error}=await sb.from('snapshots').select('*').eq('hotel_id','cocoon_suites').order('snapshot_date',{ascending:false});
    if(error)throw new Error(error.message);
    if(!snaps?.length)throw new Error('No snapshots found.');

    const CY=2026,LY=2025;
    const latest=snaps.filter(s=>s.year===CY)[0];
    const lySnap=findClosest(snaps,LY,latest.snapshot_date.replace(CY,LY));
    const lyFinal=snaps.filter(s=>s.year===LY).sort((a,b)=>b.snapshot_date.localeCompare(a.snapshot_date))[0];

    document.getElementById('snapshot-info').textContent=`Season ${CY} · Snapshot: ${latest.snapshot_date} · vs same week ${LY}: ${lySnap?.snapshot_date||'N/A'}`;

    const cy={occ:latest.total_occ_pct,adr:latest.total_adr,revpar:latest.total_revpar,rev:latest.total_room_rev};
    const ly={occ:lySnap?.total_occ_pct,adr:lySnap?.total_adr,revpar:lySnap?.total_revpar,rev:lySnap?.total_room_rev};

    const brief=[];
    if(cy.occ&&ly.occ&&cy.occ-ly.occ<-3)brief.push({type:'alert',text:`<strong>Season OCC is ${Math.abs(cy.occ-ly.occ).toFixed(1)} pts behind same week last year</strong> — ${fmt(cy.occ)} vs ${fmt(ly.occ)}.`});
    if(cy.adr&&ly.adr&&cy.adr>ly.adr)brief.push({type:'good',text:`<strong>ADR up ${(((cy.adr-ly.adr)/ly.adr)*100).toFixed(1)}% vs same week last year</strong> — ${fmt(cy.adr,'eur')} vs ${fmt(ly.adr,'eur')}. Rate strategy working.`});

    const rows=MONTHS.map((month,i)=>({month,i,cOcc:latest.occ_pct?.[i],lOcc:lySnap?.occ_pct?.[i],cAdr:latest.adr?.[i],lAdr:lySnap?.adr?.[i],season:SEASON[i],isAlert:latest.occ_pct?.[i]!=null&&lySnap?.occ_pct?.[i]!=null&&(latest.occ_pct[i]-lySnap.occ_pct[i])<-5}));
    const alertM=rows.filter(r=>r.isAlert&&r.cOcc<80);
    if(alertM.length)brief.push({type:'alert',text:`<strong>${alertM[0].month} is ${Math.abs(alertM[0].cOcc-alertM[0].lOcc).toFixed(1)} pts behind same week last year</strong> — ${fmt(alertM[0].cOcc)} vs ${fmt(alertM[0].lOcc)}. Consider a promotion.`});
    if(!brief.length)brief.push({type:'neutral',text:'Season tracking in line with last year. Continue monitoring peak months.'});

    const kpis=[
      {label:'Season OCC%',v:cy.occ,ly:ly.occ,type:'pct',fmtType:'pct'},
      {label:'ADR (to date)',v:cy.adr,ly:ly.adr,type:'eur_pct',fmtType:'eur'},
      {label:'RevPAR (to date)',v:cy.revpar,ly:ly.revpar,type:'eur_pct',fmtType:'eur'},
      {label:'Room Revenue',v:cy.rev,ly:ly.rev,type:'eur_pct',fmtType:'rev'},
    ];

    const html=`
      <div class="briefing">
        <div class="briefing-label">☀ AI Morning Briefing</div>
        <div class="briefing-items">${brief.map(p=>`<div class="briefing-item"><div class="briefing-dot dot-${p.type}"></div><div>${p.text}</div></div>`).join('')}</div>
      </div>
      <div class="section-label">Season To Date — ${CY} vs Same Week ${LY}</div>
      <div class="kpi-grid">${kpis.map(k=>{
        const diff=k.v&&k.ly?(k.type==='pct'?k.v-k.ly:((k.v-k.ly)/k.ly*100)):null;
        const cls=diff===null?'neutral':diff>0?'up':'down';
        const arrow=diff===null?'—':diff>0?'▲':'▼';
        const diffStr=diff===null?'—':k.type==='pct'?`${arrow} ${Math.abs(diff).toFixed(1)} pts`:`${arrow} ${diff>0?'+':''}${diff.toFixed(1)}%`;
        const valStr=k.fmtType==='rev'?(k.v?'€'+Math.round(k.v/1000)+'K':'—'):fmt(k.v,k.fmtType==='pct'?'pct':'eur');
        const lyStr=k.fmtType==='rev'?(k.ly?'€'+Math.round(k.ly/1000)+'K':'—'):fmt(k.ly,k.fmtType==='pct'?'pct':'eur');
        return`<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-current">${valStr}</div><div class="kpi-ly">${LY} same week: ${lyStr}</div><div class="kpi-delta ${cls}">${diffStr}</div></div>`;
      }).join('')}</div>
      <div class="table-card">
        <div class="card-title">Booking Pace — ${CY} Now vs Same Week ${LY}</div>
        <div class="card-sub">Snapshot ${latest.snapshot_date} vs ${lySnap?.snapshot_date||'N/A'}</div>
        <table><thead><tr><th>Month</th><th>Season</th><th>Pace</th><th>${CY} OCC%</th><th>${LY} OCC%</th><th>OCC Δ</th><th>${CY} ADR</th><th>${LY} ADR</th><th>ADR Δ</th><th>Action</th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="${r.isAlert?'row-alert':''}"><td>${r.isAlert?'⚠ ':''}${r.month}</td><td><span class="season-badge ${SB[r.season]}">${SL[r.season]}</span></td><td><div class="pace-bars"><div class="pace-row"><span class="pace-year">${CY}</span><div class="pace-track"><div class="pace-fill fill-now" style="width:${Math.min(r.cOcc||0,100)}%"></div></div></div><div class="pace-row"><span class="pace-year">${LY}</span><div class="pace-track"><div class="pace-fill fill-ly" style="width:${Math.min(r.lOcc||0,100)}%"></div></div></div></div></td><td style="color:var(--gold);font-weight:600">${fmt(r.cOcc)}</td><td style="color:var(--text-3)">${fmt(r.lOcc)}</td><td>${warnPill(r.cOcc,r.lOcc)}</td><td>${fmt(r.cAdr,'eur')}</td><td>${fmt(r.lAdr,'eur')}</td><td>${pill(r.cAdr,r.lAdr,'eur_pct')}</td><td>${actionTag(r.cOcc,r.lOcc)}</td></tr>`).join('')}</tbody></table>
        <div class="note">Live from Supabase · ${snaps.length} snapshots · Refreshes on page load</div>
      </div>
      <div class="bottom-grid">
        <div class="card">
          <div class="card-title">Channel Mix — ${CY} To Date</div>
          ${latest.channel_ota_pct!=null?`
            <div class="ch-item"><div class="ch-name">OTA</div><div class="ch-bar-wrap"><div class="ch-track"><div class="ch-fill" style="width:${latest.channel_ota_pct}%;background:var(--gold)"></div></div></div><div class="ch-pct" style="color:var(--gold)">${fmt(latest.channel_ota_pct)}</div><div class="ch-rev">${fmt(latest.channel_ota_rev,'eur')}</div></div>
            <div class="ch-item"><div class="ch-name">Direct</div><div class="ch-bar-wrap"><div class="ch-track"><div class="ch-fill" style="width:${latest.channel_direct_pct||0}%;background:var(--blue)"></div></div></div><div class="ch-pct" style="color:var(--blue)">${fmt(latest.channel_direct_pct)}</div><div class="ch-rev">${fmt(latest.channel_direct_rev,'eur')}</div></div>
            <div class="note">vs ${LY}: OTA ${fmt(lySnap?.channel_ota_pct)} · Direct ${fmt(lySnap?.channel_direct_pct)}</div>
          `:'<div style="color:var(--text-3);font-size:13px">Channel data not available for this snapshot.</div>'}
        </div>
        <div class="card">
          <div class="card-title">ADR Recovery — ${CY} vs ${LY}</div>
          ${rows.filter(r=>r.cAdr&&r.lAdr&&r.i>=3).slice(0,4).map(r=>`<div class="adr-item"><div><div class="adr-month">${r.month}</div><div class="adr-vs">${LY}: ${fmt(r.lAdr,'eur')}</div></div><div style="text-align:right"><div class="adr-val">${fmt(r.cAdr,'eur')}</div>${pill(r.cAdr,r.lAdr,'eur_pct')}</div></div>`).join('')}
          <div class="note">ADR for future months = booked to date, not final season average.</div>
        </div>
      </div>
      <div class="divider"><div class="divider-line"></div><span>Full Season Summary — ${CY} vs ${LY} Final</span><div class="divider-line"></div></div>
      <div class="table-card">
        <div class="card-title">All KPIs by Month</div>
        <table><thead><tr><th>KPI</th>${MONTHS.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>${[
          {label:`OCC% ${CY}`,data:latest.occ_pct,total:latest.total_occ_pct,t:'pct',hi:true},
          {label:`OCC% ${LY}`,data:lyFinal?.occ_pct,total:lyFinal?.total_occ_pct,t:'pct',hi:false},
          {label:`ADR ${CY}`,data:latest.adr,total:latest.total_adr,t:'eur',hi:true},
          {label:`ADR ${LY}`,data:lyFinal?.adr,total:lyFinal?.total_adr,t:'eur',hi:false},
          {label:`RevPAR ${CY}`,data:latest.revpar,total:latest.total_revpar,t:'eur',hi:true},
          {label:`RevPAR ${LY}`,data:lyFinal?.revpar,total:lyFinal?.total_revpar,t:'eur',hi:false},
          {label:`Room Rev ${CY}`,data:latest.room_rev?.map(v=>v?Math.round(v/1000):null),total:latest.total_room_rev?Math.round(latest.total_room_rev/1000):null,t:'k',hi:true},
          {label:`Room Rev ${LY}`,data:lyFinal?.room_rev?.map(v=>v?Math.round(v/1000):null),total:lyFinal?.total_room_rev?Math.round(lyFinal.total_room_rev/1000):null,t:'k',hi:false},
        ].map(r=>`<tr style="${r.hi?'':'opacity:.6'}"><td style="${r.hi?'color:var(--gold);font-weight:600':'color:var(--text-2)'}">${r.label}</td>${Array.from({length:8},(_,i)=>{const v=r.data?.[i];if(v==null)return'<td>—</td>';return`<td>${r.t==='pct'?v.toFixed(2)+'%':r.t==='eur'?'€'+Math.round(v):'€'+v+'K'}</td>`;}).join('')}<td style="${r.hi?'color:var(--gold);font-weight:600':''}">${r.total==null?'—':r.t==='pct'?r.total.toFixed(2)+'%':r.t==='eur'?'€'+Math.round(r.total):'€'+r.total+'K'}</td></tr>`).join('')}</tbody></table>
        <div class="note">${CY} = bookings to date · ${LY} = full final season</div>
      </div>`;

    document.getElementById('dashboard-content').innerHTML=html;
  }catch(err){
    document.getElementById('dashboard-content').innerHTML=`<div class="error-box">❌ ${err.message}</div>`;
  }
}
</script>
</body>
</html>
